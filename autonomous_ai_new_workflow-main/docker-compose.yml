services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: anonymous-ai-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD ' /proc/net/tcp"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:0.32.0
    container_name: anonymous-ai-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  ollama-init:
    image: ollama/ollama:0.32.0
    container_name: anonymous-ai-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "nomic-embed-text:v1.5"]
    restart: "no"

volumes:
  qdrant_data:
    name: anonymous_ai_qdrant_data
  ollama_data:
    name: anonymous_ai_ollama_data
